<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bookGrad)" />
  <rect width="1200" height="320" fill="url(#lampGlow)" />

  <!-- Architectural Library Arches -->
  <g stroke="#fde68a" stroke-opacity="0.15" fill="none" stroke-width="2">
    <path d="M 0,320 L 0,100 Q 150,20 300,100 L 300,320" />
    <path d="M 300,320 L 300,100 Q 450,20 600,100 L 600,320" />
    <path d="M 600,320 L 600,100 Q 750,20 900,100 L 900,320" />
    <path d="M 900,320 L 900,100 Q 1050,20 1200,100 L 1200,320" />
  </g>

  <!-- Open Manuscript / Book Icon Graphic -->
  <g transform="translate(960, 160)" fill="none" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Page -->
    <path d="M 0,40 Q -50,20 -100,30 L -100,-50 Q -50,-60 0,-40 Z" fill="#b45309" fill-opacity="0.4" />
    <!-- Right Page -->
    <path d="M 0,40 Q 50,20 100,30 L 100,-50 Q 50,-60 0,-40 Z" fill="#b45309" fill-opacity="0.4" />
    <!-- Spine center -->
    <line x1="0" y1="-40" x2="0" y2="45" stroke="#fcd34d" stroke-width="3" />
    
    <!-- Text line representations on pages -->
    <g stroke="#fef3c7" stroke-width="1.5" stroke-opacity="0.6">
      <line x1="-80" y1="-30" x2="-20" y2="-25" />
      <line x1="-80" y1="-15" x2="-20" y2="-10" />
      <line x1="-80" y1="0" x2="-20" y2="5" />
      <line x1="-80" y1="15" x2="-40" y2="18" />

      <line x1="20" y1="-25" x2="80" y2="-30" />
      <line x1="20" y1="-10" x2="80" y2="-15" />
      <line x1="20" y1="5" x2="80" y2="0" />
      <line x1="20" y1="18" x2="60" y2="15" />
    </g>

    <!-- Feather Quill Pen -->
    <path d="M 40,-75 C 60,-90 90,-95 105,-80 C 110,-60 85,-40 55,-35 L 20,-10 L 25,-18 Z" fill="#fde68a" fill-opacity="0.8" stroke="#d97706" stroke-width="1.5" />
  </g>

  <!-- Stack of Books Silhouette -->
  <g transform="translate(180, 210)" fill="#78350f" stroke="#fde68a" stroke-width="1.5" stroke-opacity="0.4">
    <!-- Bottom book -->
    <rect x="0" y="50" width="180" height="24" rx="3" />
    <line x1="20" y1="50" x2="20" y2="74" />
    <!-- Middle book -->
    <rect x="15" y="24" width="160" height="22" rx="3" />
    <line x1="30" y1="24" x2="30" y2="46" />
    <!-- Top angled book -->
    <rect x="25" y="0" width="140" height="20" rx="3" transform="rotate(-4 25 0)" />
  </g>

  <!-- Classic Literature Quotes / Calligraphy Silhouette -->
  <g font-family="serif" font-style="italic" font-size="22" fill="#fde68a" fill-opacity="0.3">
    <text x="340" y="100">"Scientia potentia est — Knowledge is power."</text>
    <text x="400" y="170">"A room without books is like a body without a soul."</text>
    <text x="320" y="240">Nulla dies sine linea &bull; Ars longa, vita brevis</text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(60, 280)">
    <rect width="190" height="24" rx="12" fill="#451a03" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1" />
    <text x="95" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fde68a" text-anchor="middle" letter-spacing="1.5">LITERATURE &amp; ARTS</text>
  </g>
</svg>
