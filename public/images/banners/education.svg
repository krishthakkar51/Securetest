<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143d2d" />
      <stop offset="50%" stop-color="#164e3b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#eduGrad)" />

  <!-- Classical Colonnade University Pillars Silhouette -->
  <g stroke="#a3cbbe" stroke-opacity="0.2" fill="none" stroke-width="2">
    <!-- Pediment Arch / Triangle -->
    <polygon points="120,40 220,10 320,40" />
    <line x1="100" y1="40" x2="340" y2="40" stroke-width="3" />
    <!-- Columns -->
    <rect x="130" y="45" width="20" height="180" rx="2" />
    <rect x="180" y="45" width="20" height="180" rx="2" />
    <rect x="230" y="45" width="20" height="180" rx="2" />
    <rect x="280" y="45" width="20" height="180" rx="2" />
    <!-- Base -->
    <rect x="110" y="225" width="220" height="15" rx="2" />
  </g>

  <!-- Graduation Cap & Diploma Graphic -->
  <g transform="translate(980, 150)">
    <!-- Mortarboard Cap Diamond Top -->
    <polygon points="0,-40 100,-10 0,20 -100,-10" fill="#143d2d" stroke="#fcd34d" stroke-width="2.5" />
    <!-- Cap Skull Skullcap -->
    <path d="M -50,5 C -50,35 50,35 50,5" fill="#0f291e" stroke="#fcd34d" stroke-width="2" />
    <!-- Center Button & Tassel -->
    <circle cx="0" cy="-10" r="4" fill="#fbbf24" />
    <path d="M 0,-10 C 30,-5 60,10 75,30" fill="none" stroke="#fbbf24" stroke-width="2" />
    <polygon points="70,30 80,30 78,55 72,55" fill="#f59e0b" />

    <!-- Diploma Scroll Below -->
    <g transform="translate(0, 70)" stroke="#fef3c7" stroke-width="1.5" fill="#fef08a">
      <rect x="-60" y="-10" width="120" height="20" rx="4" fill="#fef9c3" />
      <rect x="-10" y="-12" width="20" height="24" rx="2" fill="#ef4444" stroke="#dc2626" />
      <circle cx="0" cy="18" r="8" fill="#ef4444" stroke="#b91c1c" />
    </g>
  </g>

  <!-- Laurel Wreath & Crest Elements -->
  <g transform="translate(600, 140)" stroke="#fcd34d" stroke-opacity="0.25" fill="none" stroke-width="2">
    <!-- Starfield & Academic Excellence Stars -->
    <polygon points="0,-60 15,-20 55,-20 25,5 35,45 0,20 -35,45 -25,5 -55,-20 -15,-20" fill="#fbbf24" fill-opacity="0.15" />
    <circle cx="0" cy="0" r="90" stroke-dasharray="6 6" />
  </g>

  <!-- Inspiring Motto Callouts -->
  <g font-family="sans-serif" font-size="16" fill="#a3cbbe" fill-opacity="0.35" font-weight="600" letter-spacing="1">
    <text x="420" y="80">ACADEMIC INTEGRITY &bull; RIGOROUS EVALUATION</text>
    <text x="440" y="240">EXCELLENCE IN PEDAGOGY &amp; LEARNING</text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(60, 280)">
    <rect width="210" height="24" rx="12" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="1" />
    <text x="105" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle" letter-spacing="1.5">GENERAL EDUCATION</text>
  </g>
</svg>
