<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="dotMatrix" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.2" fill="#38bdf8" fill-opacity="0.18" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#techGrad)" />
  <rect width="1200" height="320" fill="url(#dotMatrix)" />

  <!-- Printed Circuit Board (PCB) Traces -->
  <g stroke="#38bdf8" stroke-opacity="0.35" fill="none" stroke-width="2">
    <!-- Trace 1 -->
    <path d="M 0,80 L 180,80 L 240,140 L 420,140 L 460,100 L 700,100" />
    <circle cx="180" cy="80" r="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="420" cy="140" r="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="700" cy="100" r="5" fill="#38bdf8" />

    <!-- Trace 2 -->
    <path d="M 0,220 L 220,220 L 280,160 L 520,160 L 560,200 L 800,200" />
    <circle cx="220" cy="220" r="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="520" cy="160" r="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="800" cy="200" r="5" fill="#38bdf8" />

    <!-- Trace 3 -->
    <path d="M 1200,60 L 1050,60 L 980,130 L 820,130" stroke="#06b6d4" />
    <circle cx="1050" cy="60" r="4" fill="#0891b2" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- Microprocessor / CPU Core Graphic -->
  <g transform="translate(960, 160)">
    <!-- Outer bus pins -->
    <rect x="-80" y="-80" width="160" height="160" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6" />
    <rect x="-60" y="-60" width="120" height="120" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
    <text x="0" y="8" font-family="monospace" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">CPU CORE</text>
    <text x="0" y="28" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">64-BIT ARCH</text>

    <!-- Pins North / South / East / West -->
    <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7">
      <line x1="-50" y1="-80" x2="-50" y2="-95" />
      <line x1="-25" y1="-80" x2="-25" y2="-95" />
      <line x1="0" y1="-80" x2="0" y2="-95" />
      <line x1="25" y1="-80" x2="25" y2="-95" />
      <line x1="50" y1="-80" x2="50" y2="-95" />

      <line x1="-50" y1="80" x2="-50" y2="95" />
      <line x1="-25" y1="80" x2="-25" y2="95" />
      <line x1="0" y1="80" x2="0" y2="95" />
      <line x1="25" y1="80" x2="25" y2="95" />
      <line x1="50" y1="80" x2="50" y2="95" />
    </g>
  </g>

  <!-- Code Snippets and Binary Streams -->
  <g font-family="monospace" font-size="15" fill="#38bdf8" fill-opacity="0.3">
    <text x="60" y="50">&lt;secure_kernel&gt; void execute_audit() {</text>
    <text x="100" y="75">01100001 01101100 01100111 01101111</text>
    <text x="60" y="270">} // end runtime block [OK]</text>
    <text x="500" y="270">git commit -m "feat: academic integrity v2"</text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(60, 280)">
    <rect width="210" height="24" rx="12" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <text x="105" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#bae6fd" text-anchor="middle" letter-spacing="1.5">COMPUTER SCIENCE &amp; TECH</text>
  </g>
</svg>
