<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="sciGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="hexGrid" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M 30,0 L 60,17.3 L 60,52 L 30,69.3 L 0,52 L 0,17.3 Z M 30,69.3 L 60,86.6 L 60,121.3 L 30,138.6 L 0,121.3 L 0,86.6 Z" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#sciGrad)" />
  <rect width="1200" height="320" fill="url(#hexGrid)" />

  <!-- DNA Double Helix Wave -->
  <g stroke="#7dd3fc" stroke-opacity="0.35" fill="none" stroke-width="2">
    <path d="M 0,160 Q 150,60 300,160 T 600,160 T 900,160 T 1200,160" />
    <path d="M 0,160 Q 150,260 300,160 T 600,160 T 900,160 T 1200,160" stroke="#bae6fd" stroke-opacity="0.25" />
    <!-- Connecting base pairs -->
    <line x1="75" y1="110" x2="75" y2="210" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="150" y1="60" x2="150" y2="260" stroke-width="2" />
    <line x1="225" y1="110" x2="225" y2="210" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="375" y1="110" x2="375" y2="210" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="450" y1="60" x2="450" y2="260" stroke-width="2" />
    <line x1="525" y1="110" x2="525" y2="210" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="675" y1="110" x2="675" y2="210" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="750" y1="60" x2="750" y2="260" stroke-width="2" />
    <line x1="825" y1="110" x2="825" y2="210" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- Rutherford-Bohr Atomic Model Orbitals -->
  <g transform="translate(1000, 160)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" fill-opacity="0.8" />
    <circle cx="0" cy="0" r="8" fill="#f0f9ff" />
    <!-- Electron orbits -->
    <ellipse cx="0" cy="0" rx="100" ry="36" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.5" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="100" ry="36" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.5" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="100" ry="36" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.5" transform="rotate(90)" />
    <!-- Electrons -->
    <circle cx="86" cy="50" r="5" fill="#e0f2fe" />
    <circle cx="-86" cy="-50" r="5" fill="#e0f2fe" />
    <circle cx="0" cy="-100" r="5" fill="#e0f2fe" />
  </g>

  <!-- Chemical Benzene Rings & Molecules -->
  <g transform="translate(240, 80)" stroke="#bae6fd" stroke-opacity="0.3" fill="none" stroke-width="2">
    <polygon points="40,0 80,23 80,69 40,92 0,69 0,23" />
    <circle cx="40" cy="46" r="28" stroke-dasharray="4 4" />
    <circle cx="40" cy="0" r="4" fill="#38bdf8" />
    <circle cx="80" cy="23" r="4" fill="#38bdf8" />
    <circle cx="80" cy="69" r="4" fill="#38bdf8" />
    <circle cx="40" cy="92" r="4" fill="#38bdf8" />
    <circle cx="0" cy="69" r="4" fill="#38bdf8" />
    <circle cx="0" cy="23" r="4" fill="#38bdf8" />
  </g>

  <!-- Formulas and Constants -->
  <g font-family="monospace" font-size="20" fill="#e0f2fe" fill-opacity="0.25">
    <text x="360" y="80">E = mc^2 &bull; \hbar = \frac{h}{2\pi}</text>
    <text x="440" y="240">\Delta x \Delta p \ge \frac{\hbar}{2}</text>
    <text x="80" y="250">PV = nRT</text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(60, 280)">
    <rect width="180" height="24" rx="12" fill="#082f49" fill-opacity="0.6" />
    <text x="90" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7dd3fc" text-anchor="middle" letter-spacing="1.5">NATURAL SCIENCES</text>
  </g>
</svg>
