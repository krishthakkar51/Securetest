<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="mathAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2dd4bf" stroke-width="0.75" stroke-opacity="0.15" />
      <circle cx="0" cy="0" r="1.5" fill="#34d399" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#mathGrad)" />
  <rect width="1200" height="320" fill="url(#grid)" />

  <!-- Geometric & Trigonometric Elements -->
  <path d="M 0,260 Q 300,100 600,260 T 1200,260" fill="none" stroke="#5eead4" stroke-width="3" stroke-opacity="0.25" />
  <path d="M 0,220 Q 300,320 600,220 T 1200,220" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 6" />

  <!-- Coordinate Axis & Compass Polyhedra -->
  <g transform="translate(980, 160)" stroke="#6ee7b7" stroke-opacity="0.4" fill="none">
    <circle cx="0" cy="0" r="110" stroke-width="1.5" />
    <circle cx="0" cy="0" r="85" stroke-width="1" stroke-dasharray="4 4" />
    <polygon points="0,-100 86.6,50 -86.6,50" stroke-width="2" />
    <polygon points="0,100 86.6,-50 -86.6,-50" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#a7f3d0" />
    <line x1="-120" y1="0" x2="120" y2="0" stroke-width="1" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke-width="1" />
  </g>

  <!-- Golden Ratio Spiral / Curves -->
  <g transform="translate(800, 200)" stroke="#99f6e4" stroke-opacity="0.3" fill="none" stroke-width="1.5">
    <path d="M 0,0 A 10,10 0 0,1 10,-10 A 20,20 0 0,1 30,10 A 40,40 0 0,1 -10,50 A 70,70 0 0,1 -80,-20 A 120,120 0 0,1 40,-140" />
  </g>

  <!-- Academic Math Formulas Textures -->
  <g font-family="serif" font-style="italic" font-size="28" fill="#a7f3d0" fill-opacity="0.25">
    <text x="180" y="90">e^{i\pi} + 1 = 0</text>
    <text x="360" y="160">\int_{-\infty}^{\infty} e^{-x^2} dx = \sqrt{\pi}</text>
    <text x="220" y="230">\sum_{n=1}^{\infty} \frac{1}{n^2} = \frac{\pi^2}{6}</text>
    <text x="640" y="95">\nabla \times \mathbf{B} = \mu_0 \mathbf{J}</text>
    <text x="60" y="170">f(x) = \lim_{\Delta x \to 0} \frac{\Delta y}{\Delta x}</text>
    <text x="700" y="270">A = \pi r^2</text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(60, 280)">
    <rect width="180" height="24" rx="12" fill="#042f2e" fill-opacity="0.6" />
    <text x="90" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle" letter-spacing="1.5">MATHEMATICS &amp; LOGIC</text>
  </g>
</svg>
